function renderProjects(){let p=P();let list=db.projects.filter(p=>!p.deleted&&(projectSearch?p.name.toLowerCase().includes(projectSearch.toLowerCase()):p.start.slice(0,4)===year));let fav=db.fav[user.id]||[];const tree=p=>`<div class="project"><button onclick="chooseProject('${p.id}')">${expanded.has(p.id)?'⊟':'⊞'} ▱ ${E(p.name)} ${member(p)?'':'🔒'}</button><button onclick="toggleFav('${p.id}')">${fav.includes(p.id)?'★':'☆'}</button></div>${expanded.has(p.id)&&member(p)?`<div class="branch">${['Files','Research','Question','Creative'].map(f=>`<button class="${pid===p.id&&feature===f?'active':''}" onclick="chooseFeature('${p.id}','${f}')">${f}</button>`).join('')}</div>`:''}`;body('Projects').innerHTML=`<div class="workspace"><aside class="side ${sideOpen?'show':''}"><input placeholder="Search projects..." value="${E(projectSearch)}" oninput="projectSearch=this.value;renderProjects();let x=document.querySelector('.side input');x.focus();x.setSelectionRange(x.value.length,x.value.length)"><select onchange="year=this.value;renderProjects()">${[...new Set(['2027','2026',...db.projects.map(p=>p.start.slice(0,4))])].sort().reverse().map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select><button onclick="newProject()">+ New Project</button><div class="tree">${!projectSearch?`<h3 class="pixel">★ Favorites</h3>${db.projects.filter(p=>fav.includes(p.id)&&!p.deleted).map(tree).join('')||'<small>No favorites</small>'}<hr><h3 class="pixel">${year} Projects</h3>`:''}${list.map(tree).join('')||'<small>No projects</small>'}</div></aside><main class="main"><div class="toolbar"><button class="mobileonly" onclick="sideOpen=!sideOpen;renderProjects()">☰</button><strong class="pixel">${p&&!p.deleted?E(p.name)+' / '+feature:'Projects'}</strong><button onclick="projectDirectory()">All Projects</button>${p&&member(p)&&owner(p)?`<button onclick="manageProject('${p.id}')">⚙</button>`:''}${feature!=='Files'?`<button onclick="newChat('Projects')">+ New</button><button onc function projectDirectory(){dialog('Projects',`<button onclick="newProject()">+ New Project</button>${db.projects.filter(p=>!p.deleted).sort((a,b)=>b.start.localeCompare(a.start)).map(p=>`<div class="listrow"><div><b>${E(p.name)}</b><br><small>${E(p.start)} — ${E(p.end)} · ${E(p.client)}</small></div><button onclick="closeDialog();chooseProject('${p.id}')">${member(p)?'Open':'Join'}</button></div>`).join('')}`)}function chooseProject(x){let p=db.projects.find(p=>p.id===x);if(!member(p)){dialog('Join project',`<p>${E(p.name)} 참가코드를 입력하세요.</p><input id="joincode" placeholder="Access code"><button onclick="join('${x}')">Join</button><small>시연 코드: CES26 (CES 2026)</small>`);return}pid=x;feature='Files';expanded.add(x);sideOpen=false;renderProjects()}function join(x){let p=db.projects.find(p=>p.id===x);if($('#joincode').value!==p.code)return toast('참가코드가 일치하지 않습니다.');p.members.push(user.id);save();closeDialog();chooseProject(x)}function chooseFeature(x,f){pid=x;feature=f;sideOpen=false;scope='current';renderProjects()}function toggleFav(x){let p=db.projects.find(p=>p.id===x);if(!member(p))return toast('참가 후 즐겨찾기할 수 있습니다.');let a=db.fav[user.id]||[];db.fav[user.id]=a.includes(x)?a.filter(i=>i!==x):[...a,x];save();renderProjects()}function newProject(){dialog('New Project',`<form class="stack" onsubmit="event.preventDefault();createProject()"><label>프로젝트명</label><input id="pn" required><label>행사 시작일</label><input id="ps" type="date" required><label>행사 종료일</label><input id="pe" type="date" required><label>광고주</label><input id="pc" required><label>참가코드</label><input id="px" required><button class="darkbtn">Create</button></form>`)}function createProject(){let start=$('#ps').value,end=$('#pe').value;if(end<start)return toast('종료일을 확인하세요.');let p={id:id(),name:$('#pn').value,start,end,client:$('#pc').value,code:$('#px').value,owner:user.id,members:[user.id],files:[],shared:[]};db.projects.push(p);save();closeDialog();year=start.slice(0,4);chooseProject(p.id)}function manageProject(x){let p=db.projects.find(p=>p.id===x);if(!owner(p))return;dialog('Project settings',`<label>프로젝트명</label><input id="mpn" value="${E(p.name)}"><label>행사 기간</label><input type="date" id="mps" value="${p.start}"><input type="date" id="mpe" value="${p.end}"><label>광고주</label><input id="mpc" value="${E(p.client)}"><label>참가코드</label><input id="mpx" value="${E(p.code)}"><button onclick="updateProject('${x}')">Save</button><h3>Members</h3>${db.users.filter(u=>u.active).map(u=>`<label><input type="checkbox" ${p.members.includes(u.id)?'checked':''} ${u.id===p.owner?'disabled':''} onchange="toggleMember('${x}','${E(u.id)}',this.checked)"> ${E(u.name)}</label>`).join('')}<button onclick="if(confirm('30일 휴지통으로 이동할까요?')){trashProject('${x}');closeDialog()}">Move to Trash</button>`)}function updateProject(x){let p=db.projects.find(p=>p.id===x);p.name=$('#mpn').value;p.start=$('#mps').value;p.end=$('#mpe').value;p.client=$('#mpc').value;p.code=$('#mpx').value;save();closeDialog();render('Projects');render('Admin')}function toggleMember(x,u,v){let p=db.projects.find(p=>p.id===x);p.members=v?[...new Set([...p.members,u])]:p.members.filter(i=>i!==u);save()}function trashProject(x){db.projects.find(p=>p.id===x).deleted=Date.now();save();render('Projects');render('Admin')}
function classify(n){return /brief|브리프/i.test(n)?'Brief':/venue|베뉴|스펙/i.test(n)?'Venue':/meeting|회의/i.test(n)?'Meeting':/proposal|제안|strategy/i.test(n)?'Proposal':/feedback|피드백|광고주/i.test(n)?'Feedback':/schedule|일정|운영/i.test(n)?'Operation':/reference|레퍼런스/i.test(n)?'Reference':'Others'}let blobs={};function renderFiles(){let p=P();let fs=p.files.filter(f=>!f.deleted&&(fileFilter==='All'||f.tag===fileFilter)&&(`${f.name} ${f.content}`).toLowerCase().includes(fileSearch.toLowerCase()));if(fileView==='category')fs.sort((a,b)=>a.tag.localeCompare(b.tag));$('#projectContent').innerHTML=`<div class="pad"><div class="row"><h2 class="pixel" style="flex:1">Project Files</h2><small>${p.files.filter(f=>!f.deleted).length} items</small></div><div class="upload" ondragover="event.preventDefault()" ondrop="event.preventDefault();uploadFiles(event.dataTransfer.files)"><h3>Drop your files here</h3><p class="muted">파일을 올리면 자동으로 분류됩니다. (시연)</p><div class="row" style="justify-content:center"><button class="darkbtn" onclick="$('#uploadInput').click()">+ Upload Files</button><button onclick="addNote()">+ Add Note</button><input id="uploadInput" type="file" multiple hidden onchange="uploadFiles(this.files)"></div></div><div class="row"><input style="flex:1" placeholder="Search files & notes..." value="${E(fileSearch)}" oninput="fileSearch=this.value;renderFiles();let x=document.querySelector('#projectContent input[placeholder]');x.focus();x.setSelectionRange(x.value.length,x.value.length)"><select onchange="fileFilter=this.value;renderFiles()">${['All',...tags].map(t=>`<option ${t===fileFilter?'selected':''}>${t}</option>`).join('')}</select><select onchange="fileView=this.value;renderFiles()"><option value="all" ${fileView==='all'?'selected':''}>All Files</option><option value="category" ${fileView==='category'?'selected':''}>By Category</option></select></div>${fs.map(f=>`<div class="listrow"><div><b style="cursor:pointer" onclick="previewFile('${f.id}')">${f.note?'▤':'▧'} ${E(f.name)}</b><br><small>${E(f.date)} · ${E(nameOf(f.by))} · ${f.enabled?'Ready':'Excluded'}</small></div><select aria-label="AI category" onchange="changeTag('${f.id}',this.value)">${tags.map(t=>`<option ${t===f.tag?'selected':''}>${t}</option>`).join('')}</select><button onclick="toggleRef('${f.id}')">${f.enabled?'AI ✓':'AI ×'}</button><button onclick="fileMenu('${f.id}')">···</button></div>`).join('')||'<p class="muted" style="margin-top:20px">등록된 자료가 없습니다.</p>'}</div>`}async function uploadFiles(files){let p=P();for(let f of files){let x=id();blobs[x]=f;let content='시연용 파일 메타데이터. 실제 문서 분석 미연동.';if(f.type.startsWith('text/')||/\.(txt|md|csv)$/i.test(f.name)){try{content=(await f.text()).slice(0,30000)}catch{}}p.files.unshift({id:x,name:f.name,tag:classify(f.name),content,by:user.id,date:now(),enabled:true});}save();renderFiles();toast('파일 등록 완료 · 분류는 시연용입니다.')}function addNote(){dialog('Add Note',`<textarea id="nt" rows="7" placeholder="광고주 피드백, 회의 내용 등을 자유롭게 입력하세요."></textarea><button onclick="saveNote()" class="darkbtn">Save</button>`)}function saveNote(){let t=$('#nt').value.trim();if(!t)return;P().files.unshift({id:id(),name:t.slice(0,38)+(t.length>38?'…':''),tag:classify(t),content:t,by:user.id,date:now(),enabled:true,note:true});save();closeDialog();if(feature==='Files')renderFiles();toast('프로젝트 Note 등록 완료')}function changeTag(x,t){let f=P().files.find(f=>f.id===x);f.tag=t;f.manual=true;save();renderFiles()}function toggleRef(x){let f=P().files.find(f=>f.id===x);f.enabled=!f.enabled;save();renderFiles()}function previewFile(x){let f=P().files.find(f=>f.id===x);let b=blobs[x];dialog(f.name,`<small>${E(f.tag)} · ${E(f.date)}</small>${b&&b.type.startsWith('image/')?`<img class="filepreview" src="${URL.createObjectURL(b)}">`:''}<p style="white-space:pre-wrap">${E(f.content)}</p>${b?`<button onclick="downloadBlob('${x}')">Download original</button>`:'<small>샘플 파일 또는 이전 세션 자료: 원본 미제공</small>'}`)}function downloadBlob(x){let b=blobs[x];if(!b)return;let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=b.name;a.click()}function fileMenu(x){let f=P().files.find(f=>f.id===x);dialog('File actions',`<button onclick="previewFile('${x}')">Preview</button>${blobs[x]?`<button onclick="downloadBlob('${x}')">Download</button>`:''}${f.by===user.id||owner(P())?`<button onclick="if(confirm('자료를 삭제할까요?')){P().files.find(f=>f.id==='${x}').deleted=Date.now();save();closeDialog();renderFiles()}">Delete</button>`:''}`)}
function chatKey(n){return user.id+'|'+(n==='Global AI'?'global':pid+'|'+feature)}function currentChat(n){let k=chatKey(n);let list=db.chats[k]||=[];let c=list.find(c=>c.id===activeChats[k]);if(!c){c=list[0];if(c)activeChats[k]=c.id}return c}function newChat(n){let k=chatKey(n);let c={id:id(),title:'New chat',messages:[],date:now()};(db.chats[k]||=[]).unshift(c);activeChats[k]=c.id;save();renderChat(n)}function renderChat(n){let global=n==='Global AI', host=global?body(n):$('#projectContent');if(!host)return;let c=currentChat(n),f=global?'Global AI':feature;host.innerHTML=`${global?`<div class="toolbar"><strong class="pixel">Ask A-Dos</strong><button onclick="newChat('Global AI')">+ New</button><button onclick="showHistory('Global AI')">History</button></div>`:''}<div class="chat" id="chat-${global?'g':'p'}">${!c?.messages.length?`<div class="chatempty"><div><div class="pixel" style="font-size:45px">${f==='Question'?'?':f==='Research'?'⌕':f==='Creative'?'✦':'▣'}</div><h1 class="pixel">${f}</h1><p class="muted">${global?'무엇이든 물어보세요.':'프로젝트의 지식을 활용해 보세요.'}</p></div></div>`:c.messages.map((m,i)=>m.role==='user'?`<div class="bubble mine">${E(m.text)}${m.attach?`<br><small>▧ ${E(m.attach)}</small>`:''}</div>`:`<div class="bubble answer"><b class="pixel">■ A-Dos</b>${m.other?.length?`<div class="notice">타 프로젝트 참조: ${E(m.other.join(', '))}</div>`:''}<p style="white-space:pre-wrap;margin-top:12px">${E(m.text)}</p>${m.sources?.length?`<div class="source"><b>Sources</b>${m.sources.map(s=>`<div>${E(s.project)} · ${E(s.file)} ${s.lock?' · 원본 접근 제한':''}</div>`).join('')}</div>`:''}<div class="row" style="margin-top:12px"><button onclick="copyAnswer('${n}',${i})">Copy</button><button onclick="shareAnswer('${n}',${i})">Save / Share</button></div></div>`).join('')}</div><form class="composer" onsubmit="event.preventDefault();let t=this.querySelector('textarea').value;let a=this.querySelector('input[type=file]').files[0]?.name;if(t.trim())sendChat('${n}',t,a)"><textarea placeholder="${f==='Creative'?'어떤 작업을 함께할까요?':'무엇이 궁금하신가요?'}" rows="2"></textarea><div class="row"><button type="button" onclick="this.parentNode.querySelector('input').click()">＋ Attach</button><input type="file" hidden onchange="this.nextElementSibling.textContent=this.files[0]?.name||''"><small></small><button type="button" onclick="sourceDialog('${n}')">Sources ▾</button>${f==='Question'?`<button type="button" onclick="addNote()">+ Note</button>`:''}<span class="spacer"></span><button class="darkbtn">Send ↑</button></div><small>시연 모드 · ${global?'전체 프로젝트 + 웹 (자동)':scope==='all'?'전체 프로젝트':scope==='custom'?'선택 프로젝트':'현재 프로젝트'}${f==='Research'||f==='Creative'?' + 웹':''}</small></form>`;let sc=host.querySelector('.chat');sc.scrollTop=sc.scrollHeight}window.projectScope=()=>scope;window.projectSelected=()=>selected;function sourceDialog(n){let g=n==='Global AI',scope=g?globalScope:window.projectScope(),selected=g?globalSelected:window.projectSelected();dialog('Select Sources',`<label><input type="radio" name="scope" value="${g?'auto':'current'}" ${['auto','current'].includes(scope)?'checked':''}> ${g?'All Sources / Auto':'Current Project'}</label><label><input type="radio" name="scope" value="all" ${scope==='all'?'checked':''}> All Projects</label>${g?'<label><input type="radio" name="scope" value="web" '+(scope==='web'?'checked':'')+'> Web Only</label>':''}<label><input type="radio" name="scope" value="custom" ${scope==='custom'?'checked':''}> Select Projects</label>${db.projects.filter(p=>!p.deleted).map(p=>`<label><input type="checkbox" class="srcProject" value="${p.id}" ${selected.includes(p.id)?'checked':''}> ${E(p.name)} ${member(p)?'':'(AI only)'}</label>`).join('')}<button onclick="applyScope('${n}')">Apply</button>`)}function applyScope(n){let v=$('input[name=scope]:checked')?.value||'current',a=[...document.querySelectorAll('.srcProject:checked')].map(x=>x.value);if(n==='Global AI'){globalScope=v;globalSelected=a}else{scope=v;selected=a};closeDialog();renderChat(n)}function sendChat(n,t,a){let c=currentChat(n);if(!c){newChat(n);c=currentChat(n)}c.messages.push({role:'user',text:t,attach:a});if(c.title==='New chat')c.title=t.slice(0,36);let g=n==='Global AI',f=g?'Global AI':feature,sc=g?globalScope:scope,sel=g?globalSelected:selected;let ps=db.projects.filter(p=>!p.deleted&&(sc==='web'?false:g&&sc!=='custom'||sc==='all'||sc==='custom'&&sel.includes(p.id)||!g&&(p.id===pid||t.includes(p.name))));let sources=[];let records=[];for(let p of ps){for(let file of p.files.filter(x=>x.enabled&&!x.deleted)){records.push({p,file});}for(let s of p.shared||[])records.push({p,file:{name:s.title,content:s.text,tag:'AI-generated'}})}let words=t.toLowerCase();let ranked=records.sort((a,b)=>{let score=r=>['베뉴','벽체','면적','피드백','전략','브리프','일정','venue','brief','proposal'].filter(w=>words.includes(w)&&(`${r.file.name} ${r.file.content} ${r.file.tag}`).toLowerCase().includes(w)).length;return score(b)-score(a)});let chosen=ranked.slice(0,Math.min(4,ranked.length));let text='';if(f==='Question'){let match=chosen.filter(r=>/베뉴|벽체|면적/.test(t)?r.file.tag==='Venue':/피드백/.test(t)?r.file.tag==='Feedback':/브리프/.test(t)?r.file.tag==='Brief':false);if(match.length){chosen=match;text='등록된 자료에서 확인한 내용입니다.\n\n'+match.map(r=>`${r.p.name} — ${r.file.content}`).join('\n\n')+'\n\n최종 승인 여부는 원본 자료를 확인해야 합니다.'}else{text='현재 등록된 시연 자료에서 질문에 대한 확실한 답변을 확인할 수 없습니다. 필요한 정보는 Add Note로 추가할 수 있습니다.';chosen=[]}}else if(f==='Creative'){text='[시연용 기획 제안]\n\n01. Beyond the Screen\n제품을 보여주는 전시에서 관람객이 직접 경험하는 전시로 전환합니다.\n\n02. Connected Moments\n브랜드 메시지를 관람객 여정 전반에 연결합니다.\n\n검토 포인트: 최신 광고주 피드백과 운영 인력 제약을 반영해야 합니다. 이 제안은 확정 사항이 아닙니다.'}else if(f==='Research'){text='[시연용 리서치 결과]\n\n1. 몰입형 미디어 공간 — 관람객의 움직임과 미디어가 연동되는 경험.\n2. 개인화된 체험 콘텐츠 — 관람객별 선택에 따른 메시지 전달.\n\n현재 프로젝트의 브랜드 경험 강화 방향과 연결할 수 있습니다. 실제 웹 검색은 연결되지 않았습니다.'}else{text='[통합 AI 시연 답변]\n\n'+(chosen.length?chosen.map(r=>`${r.p.name}: ${r.file.content}`).join('\n\n'):'현재 참조할 자료가 없습니다.')+'\n\n실제 AI 및 웹 검색은 연결되지 않은 상태입니다.'}sources=chosen.map(r=>({project:r.p.name,file:r.file.name,lock:!member(r.p)}));let other=[...new Set(chosen.filter(r=>g||r.p.id!==pid).map(r=>r.p.name))];c.messages.push({role:'assistant',text,sources,other});save();renderChat(n)}function copyAnswer(n,i){let t=currentChat(n).messages[i].text;navigator.clipboard?.writeText(t).then(()=>toast('Copied')).catch(()=>dialog('Copy',`<textarea rows="8">${E(t)}</textarea>`))}function shareAnswer(n,i){let m=currentChat(n).messages[i];dialog('Save / Share',`<p>개인 보관함 또는 참가 프로젝트 공용 보관함에 저장합니다.</p><button onclick="saveAnswer('${n}',${i},'personal')">My Saved</button><select id="shareTarget">${db.projects.filter(p=>!p.deleted&&member(p)).map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${E(p.name)}</option>`).join('')}</select><select id="shareCategory">${['Research','Question','Creative'].map(f=>`<option ${feature===f?'selected':''}>${f}</option>`).join('')}</select><button onclick="saveAnswer('${n}',${i},'project')">Share to Project</button>`)}function saveAnswer(n,i,where){let c=currentChat(n),m=c.messages[i],s={id:id(),title:c.title,text:m.text,by:user.id,date:now(),sources:m.sources,other:m.other,category:$('#shareCategory')?.value||feature};if(where==='personal')(db.saved[user.id]||=[]).push(s);else{let p=db.projects.find(p=>p.id===$('#shareTarget').value);if(!p||!member(p))return;p.shared.push(s)}save();closeDialog();toast('Saved')}function showHistory(n){let k=chatKey(n),g=n==='Global AI';dialog('History',`<div class="tabs"><button onclick="historyTab='my';showHistory('${n}')">My History</button><button onclick="historyTab='shared';showHistory('${n}')">${g?'My Saved':'Shared'}</button></div>${historyTab==='my'?(db.chats[k]||[]).map(c=>`<div class="listrow"><div>${E(c.title)}<br><small>${E(c.date)}</small></div><button onclick="activeChats['${k}']='${c.id}';closeDialog();renderChat('${n}')">Open</button></div>`).join(''):(g?db.saved[user.id]||[]:P().shared.filter(s=>s.category===feature)).map(s=>`<div class="panel"><b>${E(s.title)}</b><p style="white-space:pre-wrap">${E(s.text)}</p><small>AI generated · ${E(nameOf(s.by))}</small></div>`).join('')||'<small>No saved results</small>'}`)}
function renderNotes(){body('Notepad').innerHTML=`<div class="pad"><div class="row"><h2 class="pixel" style="flex:1">Team Notes</h2><button onclick="editTeamNote()">+ New Note</button></div>${[...db.notes].sort((a,b)=>Number(!!b.pin)-Number(!!a.pin)).map(n=>`<div class="notecard"><div class="row"><b>${n.pin?'★ ':''}${E(nameOf(n.by))}</b><small>${E(n.date)}</small><span class="spacer"></span>${isAdmin()?`<button onclick="pinNote('${n.id}')">${n.pin?'Unpin':'Pin'}</button>`:''}${n.by===user.id?`<button onclick="editTeamNote('${n.id}')">Edit</button>`:''}${n.by===user.id||isAdmin()?`<button onclick="deleteTeamNote('${n.id}')">×</button>`:''}</div><p style="margin-top:12px">${E(n.text)}</p>${n.comments.map(c=>`<div class="comment"><small>${E(nameOf(c.by))} · ${E(c.date)}</small><p>${E(c.text)}</p>${c.by===user.id?`<button onclick="editComment('${n.id}','${c.id}')">Edit</button>`:''}${c.by===user.id||isAdmin()?`<button onclick="deleteComment('${n.id}','${c.id}')">Delete</button>`:''}</div>`).join('')}<form class="row" onsubmit="event.preventDefault();comment('${n.id}',this.querySelector('input').value)"><input style="flex:1" placeholder="댓글 입력"><button>Send</button></form></div>`).join('')}</div>`}function editTeamNote(x){let n=db.notes.find(n=>n.id===x);dialog('Team Note',`<textarea id="teamtext" rows="6">${E(n?.text||'')}</textarea><button onclick="saveTeamNote('${x||''}')">Save</button>`)}function saveTeamNote(x){let t=$('#teamtext').value.trim();if(!t)return;if(x)db.notes.find(n=>n.id===x).text=t;else db.notes.unshift({id:id(),by:user.id,text:t,date:now(),comments:[]});save();closeDialog();renderNotes()}function pinNote(x){let n=db.notes.find(n=>n.id===x);n.pin=!n.pin;save();renderNotes()}function deleteTeamNote(x){if(confirm('메모를 삭제할까요?')){db.notes=db.notes.filter(n=>n.id!==x);save();renderNotes()}}function comment(x,t){if(!t.trim())return;db.notes.find(n=>n.id===x).comments.push({id:id(),by:user.id,text:t,date:now()});save();renderNotes()}function editComment(x,y){let c=db.notes.find(n=>n.id===x).comments.find(c=>c.id===y);dialog('Edit comment',`<textarea id="commenttext">${E(c.text)}</textarea><button onclick="saveComment('${x}','${y}')">Save</button>`)}function saveComment(x,y){let t=$('#commenttext').value.trim();if(!t)return;db.notes.find(n=>n.id===x).comments.find(c=>c.id===y).text=t;save();closeDialog();renderNotes()}function deleteComment(x,y){let n=db.notes.find(n=>n.id===x);n.comments=n.comments.filter(c=>c.id!==y);save();renderNotes()}
function renderCharlie(){body('Charlie Charlie').innerHTML=`<div class="chat" style="background:#e9e9e9"><p style="text-align:center" class="muted">'찰리찰리'님을 초대했습니다.</p>${charlie.map(m=>`<div class="bubble mine" style="background:#222;color:white">${E(m.q)}</div><div class="row" style="align-items:start"> <div style="width:42px;flex-shrink:0">${iconSvg('Charlie Charlie')}</div><div><small>찰리찰리</small><div class="bubble" style="font-size:30px;font-weight:900;background:white;margin-top:4px">${m.a}</div></div></div>`).join('')}</div><form class="composer row" onsubmit="event.preventDefault();askCharlie(this.querySelector('input').value)"><input style="flex:1" placeholder="묻고 싶은 것을 입력하거나 생각하며 전송 버튼을 누르세요."><button class="darkbtn">↑</button></form><small style="padding:5px 12px">무작위 답변 · 오락용 · 기록 없음</small>`;let c=body('Charlie Charlie').querySelector('.chat');c.scrollTop=c.scrollHeight}function askCharlie(t){t=t.trim();if(t&&!/^찰리/.test(t))t='찰리찰리 '+t;charlie.push({q:t||'찰리찰리',a:Math.random()<.5?'YES':'NO'});renderCharlie()}
function renderDaily(){let p=dailyPage;body('Daily Fortune').innerHTML=`<div class="terminal"><div class="row"><b>A-DOS NETWORK</b><span class="spacer"></span><small style="color:#bbb">${day()}</small></div><hr>${p==='home'?`<pre>Initializing system... OK\nConnecting to A-Dos Network... OK\nConnection established.</pre><hr><p onclick="dailyCommand('1')" style="cursor:pointer">1. 오늘의 운세 확인</p><p onclick="dailyCommand('2')" style="cursor:pointer">2. 오늘의 메뉴 추천</p>`:`<pre>&gt; ${p==='fortune'?'FORTUNE':'MENU'}.exe\nAccessing database... OK\n████████████████ 100%</pre><hr><p>[ ${p==='fortune'?'오늘의 운세':'오늘의 추천 메뉴'} ]</p><h2>${E(dailyResult)}</h2><hr>${p==='menu'?'<p onclick="dailyCommand(\'1\')" style="cursor:pointer">1. 다른 메뉴 추천받기</p>':''}<p onclick="dailyCommand('0')" style="cursor:pointer">0. 메인 메뉴로 돌아가기</p>`}<hr><form onsubmit="event.preventDefault();dailyCommand(this.querySelector('input').value)">선택 &gt; <input inputmode="numeric" maxlength="1" placeholder="▉" aria-label="메뉴 번호"><button style="border:0;padding:0">↵</button></form><hr><small style="color:#bbb">● CONNECTED　 A-DOS SYSTEM</small></div>`;if(innerWidth>700)body('Daily Fortune').querySelector('input').focus()}function dailyCommand(c){c=c.trim();if(c==='0'){dailyPage='home'}else if(dailyPage==='home'&&c==='1'){dailyPage='fortune';let key='fortune-'+user.id, old=read(key,null);if(old?.date===day())dailyResult=old.text;else{dailyResult=rand(db.fortune)||'등록된 운세가 없습니다.';write(key,{date:day(),text:dailyResult})}}else if(dailyPage==='home'&&c==='2'||dailyPage==='menu'&&c==='1'){dailyPage='menu';dailyResult=rand(db.menus)||'등록된 메뉴가 없습니다.'}else return toast('올바른 메뉴 번호를 입력해 주세요.');renderDaily()}
function renderMail(){body('Mail').innerHTML=`<div class="pad stack"><div style="text-align:center">${iconSvg('Mail').replace('<svg','<svg style="width:80px;height:80px"')}<h2>Mail to Developer</h2><p>오류 제보, 기능 요청, 기타 의견을 자유롭게 남겨주세요.</p></div><hr><small>From: ${E(user.name)}<br>To: A-Dos Developer</small><textarea id="mailtext" rows="7" placeholder="내용을 입력하세요."></textarea><label>이미지 첨부 <input id="mailimage" type="file" accept="image/*"></label><button class="darkbtn" onclick="sendMail()">Send Mail</button><small>시연용 내부 Inbox에 저장됩니다.</small></div>`}async function sendMail(){let t=$('#mailtext').value.trim();if(!t)return;let f=$('#mailimage').files[0],img='';if(f){if(f.size>1500000)return toast('데모에서는 1.5MB 이하 이미지를 첨부해 주세요.');img=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}db.mail.unshift({id:id(),by:user.id,text:t,date:now(),img,read:false});save();body('Mail').innerHTML='<div class="pad" style="text-align:center"><h1>Mail Sent!</h1><p>소중한 의견 감사합니다.</p><button onclick="renderMail()">OK</button></div>';render('Admin')}
function renderAdmin(){if(!isAdmin())return;let tabs=['Users','Projects','Inbox','Daily DB','Settings'];body('Admin').innerHTML=`<div class="toolbar">${tabs.map(t=>`<button class="${adminTab===t?'darkbtn':''}" onclick="adminTab='${t}';renderAdmin()">${t}${t==='Inbox'?' ('+db.mail.filter(m=>!m.read).length+')':''}</button>`).join('')}</div><div class="pad" id="adminContent"></div>`;let a=$('#adminContent');if(adminTab==='Users')a.innerHTML=`<div class="row"><h2 style="flex:1">Users</h2><button onclick="newUser()">+ New User</button></div>${db.users.map(u=>`<div class="listrow"><div><b>${E(u.name)}</b><br><small>${E(u.id)} · ${u.role} · ${u.active?'Active':'Inactive'}</small></div>${u.role!=='Admin'?`<button onclick="toggleUser('${E(u.id)}')">${u.active?'Deactivate':'Activate'}</button><button onclick="resetPw('${E(u.id)}')">Reset password</button>`:''}</div>`).join('')}`;else if(adminTab==='Projects'){db.projects=db.projects.filter(p=>!p.deleted||Date.now()-p.deleted<30*86400000);save();a.innerHTML=`<h2>Projects</h2>${db.projects.filter(p=>!p.deleted).map(p=>`<div class="listrow"><div><b>${E(p.name)}</b><br><small>${p.members.length} members · ${p.files.length} files</small></div><button onclick="manageProject('${p.id}')">Manage</button></div>`).join('')}<h3 style="margin-top:20px">Trash (30 days)</h3>${db.projects.filter(p=>p.deleted).map(p=>`<div class="listrow"><div>${E(p.name)}</div><button onclick="restoreProject('${p.id}')">Restore</button></div>`).join('')||'<small>Empty</small>'}`}else if(adminTab==='Inbox')a.innerHTML=`<h2>Inbox</h2>${db.mail.map(m=>`<div class="listrow"><div><b>${m.read?'':'● '}${E(nameOf(m.by))}</b><br>${E(m.text.slice(0,70))}<br><small>${E(m.date)}</small></div><button onclick="openMail('${m.id}')">Read</button></div>`).join('')||'<p>No messages</p>'}`;else if(adminTab==='Daily DB')a.innerHTML=`<h2>Daily DB</h2>${['fortune','menus'].map(k=>`<h3>${k==='fortune'?'Fortune':'Menu'}</h3>${db[k].map((v,i)=>`<div class="listrow"><div>${E(v)}</div><button onclick="removeDaily('${k}',${i})">×</button></div>`).join('')}<textarea id="db-${k}" rows="3" style="width:100%;margin-top:10px" placeholder="한 줄에 한 항목"></textarea><button onclick="addDaily('${k}')">+ Add Records</button><hr>`).join('')}`;else a.innerHTML=`<h2>Settings</h2><label>References · Google Drive URL</label><input id="refurl" style="width:100%;margin:10px 0" value="${E(db.refs)}" placeholder="https://drive.google.com/..."><button onclick="saveRefs()">Save</button><hr><h3>AI Configuration</h3><p>OpenAI · Not connected</p><p>Demo Mode — API calls disabled</p><hr><button onclick="if(confirm('모든 브라우저 시연 데이터를 초기화할까요?')){localStorage.removeItem('ados-db');location.reload()}">Reset Demo Data</button>`}function newUser(){dialog('Create account',`<input id="uname" placeholder="사용자 이름"><input id="uid" placeholder="로그인 ID"><button onclick="createUser()">Create</button>`)}function createUser(){let n=$('#uname').value.trim(),u=$('#uid').value.trim();if(!n||!u||!/^[a-zA-Z0-9_-]+$/.test(u)||db.users.some(x=>x.id===u))return toast('이름과 중복되지 않는 영문 ID를 입력하세요.');let pw=id();db.users.push({id:u,name:n,pw,role:'Member',active:true,first:true});save();dialog('Temporary password',`<p>ID: ${E(u)}</p><p>Password: <b>${pw}</b></p><button onclick="closeDialog();renderAdmin()">OK</button>`)}function toggleUser(x){let u=db.users.find(u=>u.id===x);u.active=!u.active;save();renderAdmin()}function resetPw(x){let u=db.users.find(u=>u.id===x);u.pw=id();u.first=true;save();dialog('Temporary password',`<p>${E(u.pw)}</p><button onclick="closeDialog()">OK</button>`)}function restoreProject(x){delete db.projects.find(p=>p.id===x).deleted;save();renderAdmin()}function openMail(x){let m=db.mail.find(m=>m.id===x);m.read=true;save();renderAdmin();dialog('Message',`<small>${E(nameOf(m.by))} · ${E(m.date)}</small><p style="white-space:pre-wrap">${E(m.text)}</p>${m.img?`<img class="filepreview" src="${m.img}">`:''}<button onclick="db.mail=db.mail.filter(m=>m.id!=='${x}');save();closeDialog();renderAdmin()">Delete</button>`)}function removeDaily(k,i){db[k].splice(i,1);save();renderAdmin()}function addDaily(k){let a=$('#db-'+k).value.split('\n').map(t=>t.trim()).filter(Boolean);db[k]=[...new Set([...db[k],...a])];save();renderAdmin()}function saveRefs(){let t=$('#refurl').value.trim();if(t&&!/^https:\/\/drive\.google\.com\//.test(t))return toast('Google Drive URL을 입력하세요.');db.refs=t;save();toast('Saved')}
login();</script></html>
